<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StockPro - Warehouse Management</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: 'Poppins', sans-serif;
    }

    body{
      background:#f1f5f9;
      min-height:100vh;
      padding:30px;
      color:#1e293b;
    }

    .container{
      max-width:1200px;
      margin:auto;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
    }

    .header h1{
      font-size:32px;
      font-weight:700;
    }

    .header p{
      color:#64748b;
      margin-top:5px;
    }

    .top-cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
      margin-bottom:25px;
    }

    .card{
      background:white;
      border-radius:18px;
      padding:22px;
      box-shadow:0 5px 15px rgba(0,0,0,0.05);
    }

    .card h3{
      font-size:15px;
      color:#64748b;
      margin-bottom:10px;
      font-weight:500;
    }

    .card h2{
      font-size:30px;
      font-weight:700;
    }

    .main{
      display:grid;
      grid-template-columns:350px 1fr;
      gap:20px;
    }

    .form-box,
    .table-box{
      background:white;
      border-radius:20px;
      padding:25px;
      box-shadow:0 5px 15px rgba(0,0,0,0.05);
    }

    .form-box h2,
    .table-box h2{
      margin-bottom:20px;
      font-size:22px;
    }

    .form-group{
      margin-bottom:18px;
    }

    .form-group label{
      display:block;
      margin-bottom:8px;
      font-weight:500;
    }

    .form-group input,
    .form-group select{
      width:100%;
      padding:12px;
      border:1px solid #dbeafe;
      border-radius:10px;
      font-size:15px;
      outline:none;
      transition:0.3s;
    }

    .form-group input:focus,
    .form-group select:focus{
      border-color:#2563eb;
    }

    .btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#2563eb;
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#1d4ed8;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    table thead{
      background:#eff6ff;
    }

    table th{
      padding:15px;
      text-align:left;
      color:#1e3a8a;
      font-size:14px;
    }

    table td{
      padding:15px;
      border-bottom:1px solid #e2e8f0;
      font-size:14px;
    }

    .status{
      padding:6px 12px;
      border-radius:20px;
      font-size:13px;
      font-weight:600;
      display:inline-block;
    }

    .available{
      background:#dcfce7;
      color:#166534;
    }

    .low{
      background:#fee2e2;
      color:#991b1b;
    }

    .actions button{
      border:none;
      padding:8px 12px;
      border-radius:8px;
      cursor:pointer;
      font-size:13px;
      margin-right:5px;
    }

    .delete{
      background:#ef4444;
      color:white;
    }

    .edit{
      background:#f59e0b;
      color:white;
    }

    .empty{
      text-align:center;
      padding:40px;
      color:#94a3b8;
    }

    @media(max-width:900px){

      .main{
        grid-template-columns:1fr;
      }

    }

  </style>
</head>
<body>

  <div class="container">

    <div class="header">
      <div>
        <h1>📦 StockPro</h1>
        <p>Hệ thống quản lý kho hàng thông minh</p>
      </div>
    </div>

    <!-- Dashboard -->
    <div class="top-cards">

      <div class="card">
        <h3>Tổng sản phẩm</h3>
        <h2 id="totalProducts">0</h2>
      </div>

      <div class="card">
        <h3>Tổng tồn kho</h3>
        <h2 id="totalStock">0</h2>
      </div>

      <div class="card">
        <h3>Sắp hết hàng</h3>
        <h2 id="lowStock">0</h2>
      </div>

    </div>

    <div class="main">

      <!-- FORM -->
      <div class="form-box">

        <h2>Nhập / Xuất kho</h2>

        <div class="form-group">
          <label>Tên sản phẩm</label>
          <input type="text" id="name" placeholder="VD: Bàn phím cơ">
        </div>

        <div class="form-group">
          <label>Số lượng</label>
          <input type="number" id="quantity" placeholder="VD: 10">
        </div>

        <div class="form-group">
          <label>Loại giao dịch</label>

          <select id="type">
            <option value="import">Nhập hàng</option>
            <option value="export">Xuất hàng</option>
          </select>

        </div>

        <button class="btn" onclick="handleStock()">
          Xác nhận giao dịch
        </button>

      </div>

      <!-- TABLE -->
      <div class="table-box">

        <h2>Danh sách kho</h2>

        <table>

          <thead>
            <tr>
              <th>Sản phẩm</th>
              <th>Số lượng</th>
              <th>Trạng thái</th>
              <th>Hành động</th>
            </tr>
          </thead>

          <tbody id="productList">

            <tr>
              <td colspan="4" class="empty">
                Chưa có dữ liệu
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

  <script>

    let products = [];

    function handleStock(){

      const name = document.getElementById("name").value.trim();
      const quantity = Number(document.getElementById("quantity").value);
      const type = document.getElementById("type").value;

      if(name === "" || quantity <= 0){

        alert("Vui lòng nhập đầy đủ thông tin!");
        return;

      }

      let product = products.find(p => p.name.toLowerCase() === name.toLowerCase());

      if(product){

        if(type === "import"){

          product.quantity += quantity;

        }else{

          if(product.quantity < quantity){

            alert("Không đủ hàng để xuất!");
            return;

          }

          product.quantity -= quantity;

        }

      }else{

        if(type === "export"){

          alert("Sản phẩm chưa tồn tại!");
          return;

        }

        products.push({
          id: Date.now(),
          name,
          quantity
        });

      }

      renderProducts();
      resetForm();

    }

    function renderProducts(){

      const productList = document.getElementById("productList");

      if(products.length === 0){

        productList.innerHTML = `
          <tr>
            <td colspan="4" class="empty">
              Chưa có dữ liệu
            </td>
          </tr>
        `;

      }else{

        productList.innerHTML = "";

        products.forEach(product => {

          const isLow = product.quantity < 5;

          productList.innerHTML += `

            <tr>

              <td>${product.name}</td>

              <td>${product.quantity}</td>

              <td>
                <span class="status ${isLow ? 'low' : 'available'}">
                  ${isLow ? 'Sắp hết hàng' : 'Còn hàng'}
                </span>
              </td>

              <td class="actions">

                <button class="edit"
                  onclick="editProduct(${product.id})">
                  Sửa
                </button>

                <button class="delete"
                  onclick="deleteProduct(${product.id})">
                  Xóa
                </button>

              </td>

            </tr>

          `;

        });

      }

      updateDashboard();

    }

    function updateDashboard(){

      document.getElementById("totalProducts").innerText =
        products.length;

      // reduce()
      const totalStock = products.reduce((sum, product) => {

        return sum + product.quantity;

      },0);

      document.getElementById("totalStock").innerText =
        totalStock;

      const lowStock = products.filter(product =>
        product.quantity < 5
      ).length;

      document.getElementById("lowStock").innerText =
        lowStock;

    }

    function deleteProduct(id){

      if(confirm("Bạn có chắc muốn xóa sản phẩm này?")){

        products = products.filter(product =>
          product.id !== id
        );

        renderProducts();

      }

    }

    function editProduct(id){

      const product = products.find(product =>
        product.id === id
      );

      const newQuantity = prompt(
        "Nhập số lượng mới:",
        product.quantity
      );

      if(newQuantity !== null){

        product.quantity = Number(newQuantity);

        renderProducts();

      }

    }

    function resetForm(){

      document.getElementById("name").value = "";
      document.getElementById("quantity").value = "";

    }

  </script>

</body>
</html>
