<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản Lý Kho</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
            padding:30px;
        }

        .container{
            width:500px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
        }

        select{
            padding:10px;
            width:100%;
            margin-bottom:20px;
        }

        #productInfo{
            background:#f0f8ff;
            padding:15px;
            border-radius:10px;
        }

        h3{
            margin-bottom:10px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h2>Danh Sách Sản Phẩm</h2>

        <select id="product" onchange="showInfo()">

            <option value="Giấy">
                Giấy
            </option>

            <option value="Bút">
                Bút
            </option>

            <option value="Thước kẻ">
                Thước kẻ
            </option>

            <option value="Tẩy">
                Tẩy
            </option>

            <option value="Compa">
                Compa
            </option>

        </select>

        <div id="productInfo">

        </div>

    </div>

    <script>

        const products = {

            "Giấy": {
                quantity: 120,
                importDate: "15/05/2026"
            },

            "Bút": {
                quantity: 75,
                importDate: "10/05/2026"
            },

            "Thước kẻ": {
                quantity: 40,
                importDate: "08/05/2026"
            },

            "Tẩy": {
                quantity: 25,
                importDate: "12/05/2026"
            },

            "Compa": {
                quantity: 15,
                importDate: "18/05/2026"
            }

        };

        function showInfo(){

            const product =
                document.getElementById("product").value;

            const info = products[product];

            document.getElementById("productInfo").innerHTML = `

                <h3>Thông tin sản phẩm</h3>

                <p>
                    <b>Tên sản phẩm:</b>
                    ${product}
                </p>

                <p>
                    <b>Số lượng:</b>
                    ${info.quantity}
                </p>

                <p>
                    <b>Ngày nhập:</b>
                    ${info.importDate}
                </p>

            `;
        }

        showInfo();

    </script>

</body>

</html>
