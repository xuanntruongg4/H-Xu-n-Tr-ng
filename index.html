<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#f4f4f4;
            padding:30px;
        }

        .container{
            max-width:900px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            margin-bottom:20px;
            color:#333;
        }

        .form{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            margin-bottom:20px;
        }

        select,
        input,
        button{
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            background:#007bff;
            color:white;
            border:none;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        #quantityDisplay{
            margin-top:10px;
            font-weight:bold;
            color:#007bff;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        table,
        th,
        td{
            border:1px solid #ccc;
        }

        th,
        td{
            padding:12px;
            text-align:center;
        }

        th{
            background:#007bff;
            color:white;
        }

        .low-stock{
            color:red;
            font-weight:bold;
        }

    </style>

</head>
<body>

    <div class="container">

        <h1>StockPro - Quản Lý Kho</h1>

        <div class="form">

            <select id="product" onchange="showQuantity()">

                <option value="Giấy">Giấy</option>

                <option value="Bút">Bút</option>

                <option value="Thước kẻ">Thước kẻ</option>

                <option value="Tẩy">Tẩy</option>

                <option value="Compa">Compa</option>

            </select>

            <input
                type="number"
                id="quantity"
                placeholder="Nhập số lượng"
            >

            <select id="type">

                <option value="import">
                    Nhập kho
                </option>

                <option value="export">
                    Xuất kho
                </option>

            </select>

            <button onclick="addTransaction()">
                Thêm
            </button>

        </div>

        <p id="quantityDisplay">
            Số lượng hiện có: 120
        </p>

        <table>

            <thead>

                <tr>
                    <th>Sản phẩm</th>
                    <th>Số lượng</th>
                    <th>Trạng thái</th>
                </tr>

            </thead>

            <tbody id="inventoryTable">

            </tbody>

        </table>

    </div>

    <script>

        const products = {

            "Giấy": 120,
            "Bút": 75,
            "Thước kẻ": 40,
            "Tẩy": 25,
            "Compa": 15

        };

        function showQuantity(){

            const product =
                document.getElementById("product").value;

            document.getElementById("quantityDisplay").innerHTML =
                "Số lượng hiện có: " + products[product];

        }

        function renderTable(){

            const table =
                document.getElementById("inventoryTable");

            table.innerHTML = "";

            for(let product in products){

                let status = "Còn hàng";

                if(products[product] <= 10){
                    status = "Sắp hết hàng";
                }

                table.innerHTML += `

                    <tr>

                        <td>${product}</td>

                        <td>${products[product]}</td>

                        <td class="
                            ${products[product] <= 10
                                ? 'low-stock'
                                : ''
                            }
                        ">
                            ${status}
                        </td>

                    </tr>

                `;
            }
        }

        function addTransaction(){

            const product =
                document.getElementById("product").value;

            const quantity =
                Number(document.getElementById("quantity").value);

            const type =
                document.getElementById("type").value;

            if(quantity <= 0){

                alert("Vui lòng nhập số lượng hợp lệ");

                return;
            }

            if(type === "import"){

                products[product] += quantity;

            }else{

                if(quantity > products[product]){

                    alert("Không đủ hàng trong kho");

                    return;
                }

                products[product] -= quantity;
            }

            showQuantity();

            renderTable();

            document.getElementById("quantity").value = "";

        }

        renderTable();

    </script>

</body>
</html>
