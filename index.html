<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>StockPro Professional</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#f1f5f9;
      padding:30px;
      color:#1e293b;
    }

    .container{
      max-width:1400px;
      margin:auto;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
    }

    .header h1{
      font-size:34px;
      font-weight:700;
    }

    .header p{
      color:#64748b;
      margin-top:5px;
    }

    .dashboard{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
      gap:20px;
      margin-bottom:25px;
    }

    .card{
      background:white;
      border-radius:18px;
      padding:22px;
      box-shadow:0 5px 15px rgba(0,0,0,0.05);
    }

    .card h3{
      color:#64748b;
      font-size:15px;
      margin-bottom:10px;
    }

    .card h2{
      font-size:32px;
    }

    .main{
      display:grid;
      grid-template-columns:350px 1fr;
      gap:20px;
    }

    .form-box,
    .table-box,
    .history-box{
      background:white;
      border-radius:20px;
      padding:25px;
      box-shadow:0 5px 15px rgba(0,0,0,0.05);
    }

    .form-box h2,
    .table-box h2,
    .history-box h2{
      margin-bottom:20px;
      font-size:22px;
    }

    .form-group{
      margin-bottom:18px;
    }

    .form-group label{
      display:block;
      margin-bottom:8px;
      font-weight:500;
    }

    .form-group input,
    .form-group select{
      width:100%;
      padding:12px;
      border:1px solid #cbd5e1;
      border-radius:10px;
      outline:none;
      font-size:14px;
    }

    .form-group input:focus,
    .form-group select:focus{
      border-color:#2563eb;
    }

    .btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#2563eb;
      color:white;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#1d4ed8;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    table th{
      background:#eff6ff;
      padding:14px;
      text-align:left;
      font-size:14px;
      color:#1d4ed8;
    }

    table td{
      padding:14px;
      border-bottom:1px solid #e2e8f0;
      font-size:14px;
    }

    .status{
      padding:6px 12px;
      border-radius:20px;
      font-size:12px;
      font-weight:600;
    }

    .available{
      background:#dcfce7;
      color:#166534;
    }

    .low{
      background:#fee2e2;
      color:#991b1b;
    }

    .import{
      color:#16a34a;
      font-weight:600;
    }

    .export{
      color:#dc2626;
      font-weight:600;
    }

    .actions button{
      border:none;
      padding:8px 12px;
      border-radius:8px;
      cursor:pointer;
      font-size:13px;
      color:white;
    }

    .delete{
      background:#ef4444;
    }

    .search-box{
      margin-bottom:20px;
    }

    .search-box input{
      width:100%;
      padding:12px;
      border:1px solid #cbd5e1;
      border-radius:10px;
      outline:none;
    }

    @media(max-width:1000px){

      .main{
        grid-template-columns:1fr;
      }

    }

  </style>

</head>
<body>

  <div class="container">

    <div class="header">

      <div>
        <h1>📦 StockPro Professional</h1>
        <p>Hệ thống quản lý kho hàng doanh nghiệp</p>
      </div>

    </div>

    <!-- Dashboard -->

    <div class="dashboard">

      <div class="card">
        <h3>Tổng sản phẩm</h3>
        <h2 id="totalProducts">0</h2>
      </div>

      <div class="card">
        <h3>Tổng tồn kho</h3>
        <h2 id="totalStock">0</h2>
      </div>

      <div class="card">
        <h3>Sắp hết hàng</h3>
        <h2 id="lowStock">0</h2>
      </div>

      <div class="card">
        <h3>Tổng giao dịch</h3>
        <h2 id="totalTransactions">0</h2>
      </div>

    </div>

    <div class="main">

      <!-- FORM -->

      <div class="form-box">

        <h2>Nhập / Xuất kho</h2>

        <div class="form-group">
          <label>Sản phẩm</label>

          <input
            list="productSuggestions"
            type="text"
            id="name"
            placeholder="Nhập tên sản phẩm">

          <datalist id="productSuggestions"></datalist>

        </div>

        <div class="form-group">
          <label>Số lượng</label>
          <input type="number" id="quantity" placeholder="VD: 10">
        </div>

        <div class="form-group">
          <label>Loại giao dịch</label>

          <select id="type">
            <option value="Nhập">Nhập kho</option>
            <option value="Xuất">Xuất kho</option>
          </select>

        </div>

        <div class="form-group">
          <label>Ngày giao dịch</label>
          <input type="date" id="date">
        </div>

        <div class="form-group">
          <label>Nhân viên phụ trách</label>
          <input type="text" id="staff" placeholder="VD: Nguyễn Văn A">
        </div>

        <button class="btn" onclick="handleTransaction()">
          Xác nhận giao dịch
        </button>

      </div>

      <!-- TABLE -->

      <div class="table-box">

        <h2>Danh sách kho</h2>

        <div class="search-box">
          <input
            type="text"
            id="search"
            placeholder="🔍 Tìm kiếm sản phẩm..."
            onkeyup="searchProduct()">
        </div>

        <table>

          <thead>
            <tr>
              <th>Sản phẩm</th>
              <th>Tồn kho</th>
              <th>Ngày cập nhật</th>
              <th>Trạng thái</th>
              <th>Hành động</th>
            </tr>
          </thead>

          <tbody id="productList"></tbody>

        </table>

      </div>

    </div>

    <!-- HISTORY -->

    <div class="history-box" style="margin-top:20px;">

      <h2>Lịch sử nhập / xuất kho</h2>

      <table>

        <thead>
          <tr>
            <th>Mã GD</th>
            <th>Sản phẩm</th>
            <th>Loại</th>
            <th>Số lượng</th>
            <th>Ngày</th>
            <th>Nhân viên</th>
          </tr>
        </thead>

        <tbody id="historyList"></tbody>

      </table>

    </div>

  </div>

  <script>

    let products = [];
    let transactions = [];

    function handleTransaction(){

      const name =
        document.getElementById("name").value.trim();

      const quantity =
        Number(document.getElementById("quantity").value);

      const type =
        document.getElementById("type").value;

      const date =
        document.getElementById("date").value;

      const staff =
        document.getElementById("staff").value;

      if(name === "" ||
        quantity <= 0 ||
        date === "" ||
        staff === ""){

        alert("Vui lòng nhập đầy đủ thông tin!");
        return;

      }

      let product = products.find(
        p => p.name.toLowerCase() === name.toLowerCase()
      );

      if(product){

        if(type === "Nhập"){

          product.quantity += quantity;

        }else{

          if(product.quantity < quantity){

            alert("Không đủ hàng để xuất!");
            return;

          }

          product.quantity -= quantity;

        }

        product.updatedAt = date;

      }else{

        if(type === "Xuất"){

          alert("Sản phẩm chưa tồn tại!");
          return;

        }

        products.push({
          id:Date.now(),
          name,
          quantity,
          updatedAt:date
        });

      }

      transactions.push({
        id:"GD" + Math.floor(Math.random()*100000),
        name,
        type,
        quantity,
        date,
        staff
      });

      renderProducts();
      renderHistory();
      updateDashboard();
      updateSuggestions();
      resetForm();

    }

    function renderProducts(){

      const productList =
        document.getElementById("productList");

      productList.innerHTML = "";

      products.forEach(product => {

        const low = product.quantity < 5;

        productList.innerHTML += `

          <tr>

            <td>${product.name}</td>

            <td>${product.quantity}</td>

            <td>${product.updatedAt}</td>

            <td>
              <span class="status ${low ? 'low':'available'}">
                ${low ? 'Sắp hết':'Ổn định'}
              </span>
            </td>

            <td class="actions">

              <button
                class="delete"
                onclick="deleteProduct(${product.id})">

                Xóa

              </button>

            </td>

          </tr>

        `;

      });

    }

    function renderHistory(){

      const historyList =
        document.getElementById("historyList");

      historyList.innerHTML = "";

      transactions.forEach(transaction => {

        historyList.innerHTML += `

          <tr>

            <td>${transaction.id}</td>

            <td>${transaction.name}</td>

            <td class="${transaction.type === 'Nhập'
              ? 'import'
              : 'export'}">

              ${transaction.type}

            </td>

            <td>${transaction.quantity}</td>

            <td>${transaction.date}</td>

            <td>${transaction.staff}</td>

          </tr>

        `;

      });

    }

    function updateDashboard(){

      document.getElementById("totalProducts").innerText =
        products.length;

      // reduce()

      const totalStock = products.reduce((sum, product) => {

        return sum + product.quantity;

      },0);

      document.getElementById("totalStock").innerText =
        totalStock;

      const lowStock = products.filter(product =>
        product.quantity < 5
      ).length;

      document.getElementById("lowStock").innerText =
        lowStock;

      document.getElementById("totalTransactions").innerText =
        transactions.length;

    }

    function updateSuggestions(){

      const list =
        document.getElementById("productSuggestions");

      list.innerHTML = "";

      products.forEach(product => {

        list.innerHTML += `
          <option value="${product.name}">
        `;

      });

    }

    function searchProduct(){

      const keyword =
        document.getElementById("search")
        .value
        .toLowerCase();

      const rows =
        document.querySelectorAll("#productList tr");

      rows.forEach(row => {

        const productName =
          row.children[0].innerText.toLowerCase();

        if(productName.includes(keyword)){

          row.style.display = "";

        }else{

          row.style.display = "none";

        }

      });

    }

    function deleteProduct(id){

      if(confirm("Bạn chắc chắn muốn xóa?")){

        products = products.filter(
          product => product.id !== id
        );

        renderProducts();
        updateDashboard();
        updateSuggestions();

      }

    }

    function resetForm(){

      document.getElementById("name").value = "";
      document.getElementById("quantity").value = "";
      document.getElementById("staff").value = "";

    }

  </script>

</body>
</html>
