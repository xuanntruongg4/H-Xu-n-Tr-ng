<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#f4f4f4;
            padding:30px;
        }

        .container{
            max-width:900px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
        }

        h1{
            text-align:center;
            margin-bottom:20px;
            color:#333;
        }

        .form{
            display:flex;
            gap:10px;
            margin-bottom:20px;
            flex-wrap:wrap;
        }

        input, select, button{
            padding:10px;
        }

        button{
            background:#007bff;
            color:white;
            border:none;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        table, th, td{
            border:1px solid #ccc;
        }

        th, td{
            padding:10px;
            text-align:center;
        }

        .low-stock{
            color:red;
            font-weight:bold;
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>StockPro - Quản Lý Kho</h1>

        <div class="form">
<select id="product">

    <option value="Giấy">Giấy</option>

    <option value="Bút">Bút</option>

    <option value="Thước kẻ">Thước kẻ</option>

    <option value="Tẩy">Tẩy</option>

    <option value="Compa">Compa</option>

</select>
            <input type="number" id="quantity" placeholder="Số lượng">

            <select id="type">
                <option value="import">Nhập kho</option>
                <option value="export">Xuất kho</option>
            </select>

            <button onclick="addTransaction()">
                Thêm
            </button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Sản phẩm</th>
                    <th>Tồn kho</th>
                    <th>Trạng thái</th>
                </tr>
            </thead>

            <tbody id="inventoryTable">

            </tbody>
        </table>

    </div>

    <script>

        let transactions = [];

        function addTransaction(){

            const product = document.getElementById("product").value;
            const quantity = Number(document.getElementById("quantity").value);
            const type = document.getElementById("type").value;

            if(product === "" || quantity <= 0){
                alert("Vui lòng nhập dữ liệu hợp lệ");
                return;
            }

            transactions.push({
                product,
                quantity,
                type
            });

            renderInventory();

            document.getElementById("product").value = "";
            document.getElementById("quantity").value = "";
        }

        function renderInventory(){

            const inventory = transactions.reduce((result, item) => {

                if(!result[item.product]){
                    result[item.product] = 0;
                }

                if(item.type === "import"){
                    result[item.product] += item.quantity;
                }else{
                    result[item.product] -= item.quantity;
                }

                return result;

            }, {});

            const table = document.getElementById("inventoryTable");

            table.innerHTML = "";

            for(let product in inventory){

                let status = "Còn hàng";

                if(inventory[product] <= 5){
                    status = "Sắp hết hàng";
                }

                table.innerHTML += `
                    <tr>
                        <td>${product}</td>
                        <td>${inventory[product]}</td>
                        <td class="${inventory[product] <= 5 ? 'low-stock' : ''}">
                            ${status}
                        </td>
                    </tr>
                `;
            }
        }

    </script>

</body>
</html>
